StylesPath = styles
MinAlertLevel = suggestion

Packages = proselint, alex

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, proselint, alex

# Disable Microsoft's first-person plural rule (we, our, us)
Microsoft.We = NO

# Ignore YAML frontmatter keys but lint values
BlockIgnores = (?m)^[A-Za-z0-9_-]+: , (?m)^  - , (?m)^import[\s\S]*?;, (?m)^export[\s\S]*?;
TokenIgnores = lastWatched, IMDb, Wikidata, LLMs, Paddington, Sicario, Brolin, Durran, cinephile
