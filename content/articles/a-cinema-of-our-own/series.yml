title: A Cinema of Our Own
subtitle: What Britain Needs to Learn About Film
description: >
  Britain produces films that win awards but struggles to build a film culture.
  This series examines how other countries fund, protect, and sustain domestic
  cinema — and what Britain might learn from them.
