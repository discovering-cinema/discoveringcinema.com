Film Theory: >
  Film theory encompasses the scholarly frameworks used to understand, analyse,
  and interpret cinema. From formalism to psychoanalysis to cultural studies,
  it asks not just what films mean but how they produce meaning.

Spectatorship: >
  Spectatorship refers to the relationship between a viewer and a film — how
  audiences engage with, interpret, and are affected by moving images. It
  considers not just what we see but how and why we see it differently.

Streaming: >
  The shift from physical media and broadcast to on-demand streaming has
  reshaped film distribution, discovery, and preservation in ways that are
  still being understood. This section tracks both the economics and the
  cultural consequences of that shift.

Physical Media: >
  Physical media — film prints, VHS, LaserDisc, DVD, Blu-ray — is not just a
  delivery format. It is a preservation infrastructure. As streaming libraries
  shrink and rotate, physical media remains the most reliable long-term archive
  of cinema history.

Film Preservation: >
  Film preservation is the ongoing effort to prevent the permanent loss of
  moving images. With an estimated 70% of all silent films already gone, it
  is one of the most urgent problems in cultural heritage.

Realism: >
  Realism in film theory refers both to a photographic quality — the camera's
  capacity to record the world as it is — and to a set of aesthetic choices
  that seek to represent everyday life with minimal artifice. Thinkers like
  André Bazin and Siegfried Kracauer placed realism at the heart of what makes
  cinema distinct from other art forms.

Film Policy: >
  Film policy covers the legislation, tax incentives, quotas, and public funding
  structures that shape what films get made and where. From the British quota
  acts of the 1920s to modern streamer levies, policy has always been a defining
  force in national cinema.

National Cinema: >
  National cinema examines how films produced within a country reflect,
  construct, and contest national identity. It considers the industrial
  conditions that make a domestic film culture possible — and what happens
  when those conditions are eroded.

Distribution: >
  Film distribution determines which films reach audiences and on what terms.
  The shift from theatrical to streaming distribution has concentrated power
  in the hands of a small number of platforms, with profound consequences
  for independent film and cultural diversity.

Film Economics: >
  Film economics looks at how the financial structures of the film industry
  shape what gets made. From the collapse of the mid-budget film to the
  economics of streaming rights, money determines the stories that reach screens.
