Film Theory: >
  Scholarly frameworks used to understand cinema. From formalism to cultural
  studies, it asks not just what films mean but how they produce meaning.

Spectatorship: >
  How audiences engage with, interpret, and are affected by moving images.
  Spectatorship considers not just what we see but how and why we see it differently.

Streaming: >
  How on-demand streaming reshaped film distribution, discovery, and preservation.
  This section tracks the economics and cultural consequences of that shift.

Physical Media: >
  Physical media — film prints, DVD, Blu-ray — is a vital preservation
  infrastructure. As streaming libraries rotate, physical media remains a reliable archive.

Film Preservation: >
  The effort to prevent the loss of moving images. With 70% of silent films
  already gone, it is one of the most urgent problems in cultural heritage.

Realism: >
  The camera's capacity to record the world and the aesthetic choices that
  represent everyday life. Realism is at the heart of what makes cinema distinct.

Film Policy: >
  Legislation, tax incentives, and funding structures that shape what films
  get made. Policy has always been a defining force in national cinema.

National Cinema: >
  How films reflect, construct, and contest national identity. It considers the
  industrial conditions that make a domestic film culture possible.

Distribution: >
  Determining which films reach audiences and on what terms. The shift to streaming
  has concentrated power, with consequences for independent film and diversity.

Film Economics: >
  Financial structures of the film industry. From the collapse of mid-budget films
  to the economics of streaming, money determines the stories that reach screens.
